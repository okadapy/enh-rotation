# Claude отвечает на issue и чинит код: напишите @claude в issue, комментарии или ревью PR.
# Новое issue от владельца или участника Claude берёт в работу сразу, без @claude.
# PR из этого репозитория Claude ревьюит сам: при открытии и на каждый новый пуш (job review).
# Нужно один раз: приложение https://github.com/apps/claude на репозиторий и секрет
# CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) или ANTHROPIC_API_KEY в Settings → Secrets → Actions.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    # только владелец и участники: чужие issue не тратят лимит, их можно передать Claude комментарием @claude
    if: |
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' ||
          contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # новое issue: комментарий с ходом работы и задание; иначе — обычный ответ на @claude
          track_progress: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
          # блочная строка: в обычной « #» начинает YAML-комментарий и обрезает выражение
          prompt: >-
            ${{ github.event_name == 'issues' && github.event.action == 'opened' && format('Возьми в работу issue #{0}: прочитай его целиком (картинки, ссылки, вложения), разберись и почини или ответь в issue. Если не хватает данных (снапшотов, строки экспорта, уровня, экипировки) — попроси их комментарием и остановись. Правила проекта — .claude/CLAUDE.md.', github.event.issue.number) || '' }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(docker compose run:*),Bash(docker compose build:*),Bash(git:*)"

  review:
    # не черновик и не из форка: у PR из форка нет секретов, а чужой код не должен тратить лимит
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # новый пуш в тот же PR отменяет недоделанное ревью старой версии
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Сделай ревью этого PR. Ветка PR уже в рабочей папке; правила проекта — .claude/CLAUDE.md
            (AGENTS.md), карта — .claude/rules/ARCHITECTURE.md. Смотри дифф (`gh pr diff`) и ищи
            реальные дефекты, а не стиль:
            - ошибки логики и механики WoW 3.3.5a (API клиента 3.3.5a, без функций из Cata и позже);
            - нарушения правил проекта: песочница WeakAuras в src/ (pcall, loadstring, setfenv, getfenv,
              _G, SlashCmdList, package, io, debug), тексты в игре на английском, строка импорта
              не длиннее B.MAX_IMPORT, «Поиск и скорость» (бит в бит, лимиты perf), сверка с wowsims
              только через alt с причиной;
            - тесты: есть ли на изменённое поведение, проверяют ли они что-то на самом деле.
            Тесты можно запускать: `docker compose run --rm test busted --exclude-tags=perf`.

            Замечание к строке — инлайн-комментарием (mcp__github_inline_comment__create_inline_comment,
            confirmed: true); итог — одним комментарием `gh pr comment`: что проверено, найденное по
            важности, можно ли мержить. По-русски, коротко, без подписи. Код не меняй и не коммить.
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(docker compose run:*),Bash(docker compose build:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
